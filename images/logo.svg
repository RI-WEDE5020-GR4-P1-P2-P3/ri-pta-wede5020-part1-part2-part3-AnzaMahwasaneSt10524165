<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Rudzani Community Outreach logo</title>
  <circle cx="32" cy="32" r="30" fill="#15202b"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#3a4a5c" stroke-width="2"/>
  <!-- baobab trunk -->
  <path d="M27,54 C26,42 28,30 32,26 C36,30 38,42 37,54 Z" fill="#f5b942"/>
  <!-- bare upper branches, the baobab's "upside-down tree" silhouette -->
  <g stroke="#f5b942" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="26" x2="18" y2="12"/>
    <line x1="32" y1="26" x2="25" y2="8"/>
    <line x1="32" y1="26" x2="32" y2="6"/>
    <line x1="32" y1="26" x2="39" y2="8"/>
    <line x1="32" y1="26" x2="46" y2="12"/>
  </g>
  <!-- canopy clusters at each branch tip -->
  <g fill="#ffffff">
    <circle cx="18" cy="12" r="2.8"/>
    <circle cx="25" cy="8" r="2.8"/>
    <circle cx="32" cy="6" r="2.8"/>
    <circle cx="39" cy="8" r="2.8"/>
    <circle cx="46" cy="12" r="2.8"/>
  </g>
</svg>
